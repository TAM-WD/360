<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Downloader — browser integration tests</title>
  <style>
    body { margin: 24px; font: 14px/1.5 system-ui, sans-serif; color: #18212d; }
    button { padding: 8px 16px; }
    #results { white-space: pre-wrap; padding: 16px; background: #f1f5f9; }
    #fixture { margin-top: 20px; border: 1px solid #d8e0e9; max-width: 600px; }
    .ui-InfiniteList-ScrollContainer, .ui-virtual-list__scroller { height: 240px; overflow: auto; }
    .ui-InfiniteList-Container { position: relative; }
    article.message { box-sizing: border-box; min-height: 72px; padding: 8px; border-bottom: 1px solid #e2e8f0; }
    .ui-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); }
    .yamb-message-info__time { color: #64748b; font-size: 12px; }
    .yamb-message-reply { border-left: 2px solid #64748b; padding-left: 8px; }
    .yamb-message-system { text-align: center; }
  </style>
</head>
<body>
  <h1>Chat Downloader — browser integration tests</h1>
  <p>Real browser DOM fixtures; no external libraries. The result is also available as <code>window.testResults</code>.</p>
  <button id="run" type="button">Run tests</button>
  <pre id="results">Waiting for tests…</pre>
  <div id="fixture"></div>
  <script src="../chat-extractor.js"></script>
  <script>
    'use strict';

    const fixtureHost = document.getElementById('fixture');
    const resultsNode = document.getElementById('results');
    const extractorURL = new URL('../chat-extractor.js', location.href).href;
    const originalURL = location.href;
    const baseId = 1700000000000000;
    const fixtures = [];

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function equal(actual, expected, message) {
      assert(JSON.stringify(actual) === JSON.stringify(expected),
        `${message}: expected ${JSON.stringify(expected)}, received ${JSON.stringify(actual)}`);
    }

    function element(tag, attributes = {}, text = '') {
      const node = document.createElement(tag);
      for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
      node.textContent = text;
      return node;
    }

    function message(id, text, options = {}) {
      return { id: String(id), text, sender: 'Анна', ...options };
    }

    function sequence(count, options = {}) {
      return Array.from({ length: count }, (_, index) => message(baseId + index, `Сообщение ${index + 1}`, options));
    }

    function articleFor(item, index, total) {
      const article = element('article', {
        class: 'message',
        'aria-labelledby': `${item.id}_h ${item.id}_c`,
        'aria-posinset': String(index + 1)
      });
      if (total !== null) article.setAttribute('aria-setsize', String(total));
      if (item.system) {
        const system = element('div', { class: 'yamb-message-system' });
        system.append(element('span', { class: 'yamb-message-system__text' }, item.text));
        article.append(system);
        return article;
      }
      if (item.dateSeparator) article.append(element('div', { class: 'yamb-message-system' }, '5 октября 2026'));
      const row = element('div', { class: `yamb-message-row${item.own ? ' yamb-message-row_own' : ''}` });
      const header = element('div', { id: `${item.id}_h` });
      header.append(element('span', { class: 'yamb-message-user ui-sr-only', 'aria-label': item.sender }, item.sender));
      const timeAttributes = { class: 'yamb-message-info__time', 'aria-label': item.timeLabel || '10:15' };
      if (!item.noDatetime) timeAttributes.datetime = '2026-10-05T10:15:00+03:00';
      header.append(element('time', timeAttributes, '10:15'));
      row.append(header);
      const body = element('div', { id: `${item.id}_c`, class: 'yamb-message' });
      if (item.reply) {
        const quote = element('div', { class: 'yamb-message-reply', 'data-message-id': item.reply.id });
        quote.append(element('div', { class: 'yamb-message-reply__title' }, item.reply.sender));
        quote.append(element('div', { class: 'yamb-message-reply__description' }, item.reply.text));
        body.append(quote);
      }
      if (item.text !== null) {
        body.append(element('span', { 'data-copyable': 'true' }, item.text));
      }
      if (item.photo) body.append(element('img', { class: 'yamb-message-image', src: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==', alt: 'Фото', 'data-attachment': 'photo' }));
      if (item.file) {
        const file = element('a', { class: 'yamb-message-file', href: 'https://example.test/report.pdf', download: 'report.pdf', 'data-attachment': 'file' });
        file.append(element('span', { class: 'yamb-message-file__name' }, 'report.pdf'));
        body.append(file);
      }
      row.append(body);
      article.append(row);
      return article;
    }

    function resetFixture() {
      for (const cleanup of fixtures.splice(0)) cleanup();
      fixtureHost.replaceChildren();
      if (location.href !== originalURL) history.replaceState(null, '', originalURL);
    }

    function makeRoot() {
      const root = element('section', { class: 'yamb-conversation', 'data-chat-id': 'fixture-chat' });
      const header = element('header', { class: 'yamb-conversation-header' });
      header.append(element('h2', { class: 'yamb-conversation-header__title' }, 'Тестовый чат'));
      root.append(header);
      fixtureHost.append(root);
      return root;
    }

    // Emulates the legacy wheel-driven virtual list found in Messenger. Only a
    // moving window is mounted, while translateY records the virtual position.
    function legacyFixture(items, options = {}) {
      resetFixture();
      const root = makeRoot();
      const list = element('div', { class: 'ui-InfiniteList' });
      const scroller = element('div', { class: 'ui-InfiniteList-ScrollContainer', 'data-scroll-container': 'true' });
      const container = element('div', { class: 'ui-InfiniteList-Container' });
      const content = element('div', { class: 'yamb-conversation__content' });
      container.append(content);
      scroller.append(container);
      list.append(scroller);
      root.append(list);
      const windowSize = options.windowSize || 3;
      let position = options.start === undefined ? Math.max(0, items.length - windowSize) : options.start;
      let moves = 0;
      function render() {
        container.style.transform = `translateY(${-position * 72}px)`;
        content.replaceChildren(...items.slice(position, position + windowSize).map((item, offset) => articleFor(item, position + offset, options.knownSize === false ? null : items.length)));
      }
      function onWheel(event) {
        event.preventDefault();
        if (options.stalled) return;
        const forward = event.deltaY > 0;
        const next = options.skipBothDirections || options.skipDownward && forward
          ? forward ? Math.max(0, items.length - windowSize) : 0
          : position + (forward ? 2 : -2);
        position = Math.max(0, Math.min(items.length - windowSize, next));
        moves++;
        render();
      }
      scroller.addEventListener('wheel', onWheel);
      fixtures.push(() => scroller.removeEventListener('wheel', onWheel));
      render();
      return { root, scroller, content, get position() { return position; }, get moves() { return moves; } };
    }

    // Native scrolling fixture for the post-merger virtual-list scroller.
    // The actual scrollHeight/clientHeight and scroll event come from the browser.
    function nativeFixture(items) {
      resetFixture();
      const root = makeRoot();
      const scroller = element('div', { class: 'ui-virtual-list__scroller' });
      const content = element('div', { class: 'yamb-conversation__content' });
      content.append(...items.map((item, index) => articleFor(item, index, items.length)));
      scroller.append(content);
      root.append(scroller);
      scroller.scrollTop = scroller.scrollHeight;
      return { root, scroller, content };
    }

    const defaults = { delayMs: 30, stableRounds: 3, maxDurationMs: 5000, maxSteps: 200 };
    async function runExtractor(mode, extra = {}) {
      assert(window.ChatExtractor && typeof window.ChatExtractor.run === 'function', 'ChatExtractor.run is unavailable');
      return window.ChatExtractor.run({ ...defaults, ...extra, mode });
    }

    function expectMessages(result, count) {
      assert(!result.error, `Extractor error: ${result.error}`);
      assert(Array.isArray(result.messages), 'messages must be an array');
      equal(result.messages.length, count, 'message count');
      for (const item of result.messages) {
        assert(item.id, 'Every fixture message must retain its ID');
        assert(Array.isArray(item.attachments), `attachments missing for ${item.id}`);
      }
    }

    const cases = [
      ['inspect detects legacy DOM without scrolling', async () => {
        const fixture = legacyFixture(sequence(9));
        const result = await runExtractor('inspect');
        assert(result.detected, 'Legacy chat not detected');
        equal(fixture.moves, 0, 'Inspect must not scroll the chat');
      }],
      ['legacy virtualized collection retains repeated texts by ID', async () => {
        const items = sequence(11);
        items[2].text = items[7].text = 'Повторяющийся текст';
        const fixture = legacyFixture(items);
        const result = await runExtractor('collect');
        expectMessages(result, items.length);
        equal(result.messages.map(item => item.id), items.map(item => item.id), 'chronological IDs');
        equal(result.messages.filter(item => item.message === 'Повторяющийся текст').length, 2, 'repeated texts');
        assert(fixture.moves > 0, 'The virtual list was not scrolled');
        assert(result.coverage.startReached && result.coverage.endReached && result.coverage.complete, 'Known boundaries must yield complete coverage');
      }],
      ['normal message with a system date separator retains its actual text', async () => {
        const items = sequence(3);
        items[1].dateSeparator = true;
        legacyFixture(items, { start: 0 });
        const result = await runExtractor('collect');
        expectMessages(result, 3);
        const item = result.messages.find(item => item.id === items[1].id);
        equal(item.message, items[1].text, 'Actual message text must survive the date separator');
        equal(item.type, 'Сообщение', 'A date separator must not turn the message into a system event');
      }],
      ['system event retains its actual text', async () => {
        const items = sequence(3);
        items[1] = message(baseId + 1, 'Борис присоединился к чату', { system: true });
        legacyFixture(items, { start: 0 });
        const result = await runExtractor('collect');
        expectMessages(result, 3);
        const system = result.messages.find(item => item.id === items[1].id);
        assert(system.message.includes('Борис присоединился к чату'), 'System event text was discarded');
        equal(system.type, 'Системное', 'system event type');
      }],
      ['the date in the actual accessible clock label is retained', async () => {
        const items = sequence(3, { timeLabel: '10:15 5 октября 2026 г.', noDatetime: true });
        legacyFixture(items, { start: 0 });
        const result = await runExtractor('collect');
        expectMessages(result, 3);
        equal(result.messages[0].date, '5 октября 2026 г.', 'Date from accessible clock label');
      }],
      ['photo-only and file-only messages survive without copyable text', async () => {
        const items = [message(baseId, null, { photo: true }), message(baseId + 1, null, { file: true })];
        legacyFixture(items, { start: 0 });
        const result = await runExtractor('collect');
        expectMessages(result, 2);
        assert(result.messages[0].attachments.length > 0, 'Photo-only message has no attachment');
        assert(result.messages[1].attachments.some(item => JSON.stringify(item).includes('report.pdf')), 'File URL or name missing');
      }],
      ['gallery images and quoted attachments are counted only in their own message', async () => {
        const fixture = nativeFixture(sequence(2));
        const rows = fixture.content.querySelectorAll('article.message');
        const gallery = element('div', { class: 'yamb-message-gallery' });
        gallery.append(element('div', { class: 'yamb-gallery-image' }), element('div', { class: 'yamb-gallery-image' }));
        rows[0].querySelector('.yamb-message').append(gallery);
        const quote = element('div', { class: 'yamb-message-reply' });
        const file = element('div', { class: 'yamb-message-file' });
        file.append(element('span', { class: 'yamb-message-file__name' }, 'quoted.pdf'));
        quote.append(file);
        rows[1].querySelector('.yamb-message').append(quote);
        const result = await runExtractor('collect');
        equal(result.messages[0].attachments.length, 2, 'Gallery must retain both images');
        equal(result.messages[1].attachments.length, 0, 'Quoted attachment is not an attachment of the reply');
      }],
      ['screen reader author and reply fields are extracted separately', async () => {
        const items = [
          message(baseId, 'Вопрос', { sender: 'Мария' }),
          message(baseId + 1, 'Ответ', { sender: 'Александр', own: true, reply: { id: String(baseId), sender: 'Мария', text: 'Вопрос' } })
        ];
        legacyFixture(items, { start: 0 });
        const result = await runExtractor('collect');
        expectMessages(result, 2);
        equal(result.messages[0].sender, 'Мария', 'screen reader author');
        const answer = result.messages.find(item => item.id === String(baseId + 1));
        equal(answer.message, 'Ответ', 'reply body must exclude the quote');
        equal(answer.questionText, 'Вопрос', 'quoted text');
        equal(answer.questionAuthor, 'Мария', 'quoted author');
        equal(answer.replyToId, String(baseId), 'explicit reply target');
        assert(answer.isOwnMessage, 'Own message marker lost');
      }],
      ['native scroller is supported and reaches both boundaries', async () => {
        const items = sequence(14);
        const fixture = nativeFixture(items);
        assert(fixture.scroller.scrollHeight > fixture.scroller.clientHeight, 'Fixture must actually overflow');
        const inspect = await runExtractor('inspect');
        assert(inspect.detected, 'Native chat not detected');
        const result = await runExtractor('collect');
        expectMessages(result, items.length);
        assert(result.coverage.complete, 'Native boundaries must yield complete coverage');
      }],
      ['native scroll boundaries do not conceal gaps when aria-setsize is absent', async () => {
        const fixture = nativeFixture(sequence(5));
        const positions = [1, 2, 3, 9, 10];
        fixture.content.querySelectorAll('article.message').forEach((article, index) => {
          article.removeAttribute('aria-setsize');
          article.setAttribute('aria-posinset', String(positions[index]));
        });
        const result = await runExtractor('collect');
        assert(!result.coverage.complete, 'Known missing positions cannot yield complete coverage');
        equal(result.coverage.reason, 'gaps', 'Gap must be reported without a known total');
      }],
      ['collection during upward scrolling prevents virtual-list gaps', async () => {
        const items = sequence(9);
        legacyFixture(items, { skipDownward: true });
        const result = await runExtractor('collect');
        expectMessages(result, items.length);
        equal(result.messages.map(item => item.id), items.map(item => item.id), 'messages seen only during upward scrolling');
      }],
      ['confirmed boundaries with skipped middle positions remain a partial export', async () => {
        legacyFixture(sequence(9), { skipBothDirections: true });
        const result = await runExtractor('collect');
        expectMessages(result, 6);
        assert(result.coverage.startReached && result.coverage.endReached, 'Fixture must reach both known boundaries');
        assert(!result.coverage.complete, 'Skipped positions must not produce a complete export');
        equal(result.coverage.reason, 'gaps', 'Missing position reason');
      }],
      ['a stalled virtual scroller is bounded and marked partial', async () => {
        legacyFixture(sequence(12), { start: 4, stalled: true, knownSize: false });
        const started = performance.now();
        const result = await runExtractor('collect', { maxDurationMs: 1000, maxSteps: 30 });
        expectMessages(result, 3);
        assert(performance.now() - started < 2500, 'Stalled collector exceeded its time bound');
        assert(!result.coverage.complete, 'A stalled middle window must be partial');
        assert(result.metadata.warnings.length > 0, 'Partial export must carry a warning');
      }],
      ['an unconfirmed legacy end is marked partial', async () => {
        legacyFixture(sequence(6), { knownSize: false });
        const result = await runExtractor('collect');
        expectMessages(result, 6);
        assert(!result.coverage.complete && !result.coverage.endReached, 'Unconfirmed legacy end must not be claimed complete');
      }],
      ['a perpetually loading list stops at the configured limit', async () => {
        const fixture = legacyFixture(sequence(12), { start: 4, stalled: true, knownSize: false });
        fixture.root.append(element('div', { role: 'progressbar', 'aria-label': 'Загрузка истории' }, 'Загрузка…'));
        const started = performance.now();
        const result = await runExtractor('collect', { maxDurationMs: 1000, maxSteps: 30 });
        expectMessages(result, 3);
        assert(performance.now() - started < 2500, 'Loading collector exceeded its time bound');
        equal(result.coverage.reason, 'limit', 'Limit reason');
        assert(!result.coverage.complete, 'A loading list cannot be complete');
      }],
      ['replacing the active chat aborts the collection', async () => {
        const fixture = legacyFixture(sequence(30));
        const timer = setTimeout(() => {
          const replacement = fixture.root.cloneNode(true);
          replacement.setAttribute('data-chat-id', 'another-chat');
          fixture.root.replaceWith(replacement);
        }, 75);
        try {
          const result = await runExtractor('collect');
          assert(result.error, 'Changing chats must abort with an error');
          assert(!result.coverage || !result.coverage.complete, 'Aborted collection must not claim completeness');
        } finally { clearTimeout(timer); }
      }],
      ['changing the chat route aborts the collection', async () => {
        legacyFixture(sequence(30));
        const timer = setTimeout(() => {
          const changedURL = new URL(location.href);
          changedURL.searchParams.set('chat', 'another-chat');
          history.replaceState(null, '', changedURL);
        }, 75);
        try {
          const result = await runExtractor('collect');
          assert(result.error, 'Changing the chat URL must abort with an error');
        } finally { clearTimeout(timer); }
      }],
      ['script reinjection leaves a working global API', async () => {
        await new Promise((resolve, reject) => {
          const script = element('script', { src: extractorURL });
          script.onload = () => { script.remove(); resolve(); };
          script.onerror = () => { script.remove(); reject(new Error('Reinjection failed')); };
          document.body.append(script);
        });
        legacyFixture(sequence(3), { start: 0 });
        const result = await runExtractor('collect');
        expectMessages(result, 3);
      }]
    ];

    async function runAll() {
      document.getElementById('run').disabled = true;
      const summary = { status: 'running', passed: 0, failed: 0, tests: [] };
      window.testResults = summary;
      resultsNode.textContent = JSON.stringify(summary, null, 2);
      for (const [name, action] of cases) {
        const started = performance.now();
        try {
          await action();
          summary.tests.push({ name, status: 'passed', durationMs: Math.round(performance.now() - started) });
          summary.passed++;
        } catch (error) {
          summary.tests.push({ name, status: 'failed', error: error.message, durationMs: Math.round(performance.now() - started) });
          summary.failed++;
        } finally {
          resetFixture();
          resultsNode.textContent = JSON.stringify(summary, null, 2);
        }
      }
      summary.status = summary.failed ? 'failed' : 'passed';
      resultsNode.textContent = JSON.stringify(summary, null, 2);
      document.getElementById('run').disabled = false;
      return summary;
    }

    window.runBrowserTests = runAll;
    document.getElementById('run').addEventListener('click', runAll);
    runAll();
  </script>
</body>
</html>
